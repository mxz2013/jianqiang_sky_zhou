    - role: Data Scientist (Deep Learning and Computer Vision)
      time: 2022 - 2024
      company: <a href="https://www.ocus.com/" target="_blank"  rel="nofollow"> OCUS</a>
      details: |
              - Model training and fine tunning for object classification, detection, and segmentation. 

    - role: Senior Solution Scientist
      time: 2020 - 2022
      company: <a href="https://www.flyinstinct.com/" target="_blank"  rel="nofollow"> Flyininstinct</a>
      details: |
              - Introduced an instant segmentation model (i.e., <a href="https://ieeexplore.ieee.org/document/8237584" target="_blank" rel="nofollow">Mask-RCNN </a> ), which reduces more than 70% system false-positive errors. 
              - Delivered a 3D-vision based module (i.e., <a href="https://en.wikipedia.org/wiki/Orthophoto" target="_blank" rel="nofollow">Orthophoto </a>), which yields better detection performance.  
              - Invented an approach to match images with different luminosity (more efficient than the state-of-the-art, e.g., <a href="https://en.wikipedia.org/wiki/Histogram_matching" target="_blank" rel="nofollow">Histogram-matching </a>, or <a href="https://en.wikipedia.org/wiki/Gamma_correction" target="_blank" rel="nofollow">Gamma-correction </a>), which improves 50% of object detection rate. 
              - Designed a localization algorithm based on perspective transform, leading to an increase of the detection rate from smaller than 10% to more than 90%.
                
    - role: Post-doctoral Fellow 
      time: 2018 - 2020 
      company: Institut des Nanosciences de Paris Sorbonne Université 
      details: |
             Scientific computing and analysis of low-dimensional materials.
              - Applied a machine-learning type approach to computing scientific concepts.
    - role: Post-doctoral Fellow 
      time: 2016 - 2018
      company: Laboratoire des Solides Irradiés École Polytechnique
      details: |
              Making strategies to confirm my theoretical predications from my thesis, and writing articles related to Ph.D. project.
              - Developed mathematical methods and implemented them in a software (in Python) for bleeding-edge numerical simulations, leading to several top-tier peer-review publications.
              - Proposed a bleeding-edge experiment to confirm my theoretical predictions, with collaborations of researchers from different domains, and countries.
              - Organized ETSF correlation team meeting at École Polytechnique, France (+30 participants worldwide).
              - Received 3 invited seminars on my researching projects.
              - Published one article that applies the probability theory in physics (see publication EPJB2018).  

